[package]
name = "shipflow-service"
version = "0.1.0"
description = "Standalone ShipFlow Service companion"
authors = ["Codex"]
edition = "2021"

[[bin]]
name = "shipflow-service"
path = "src/main.rs"

[dependencies]
shipflow3_tauri_lib = { package = "shipflow3-tauri", path = "../../src-tauri" }
shipflow-core = { path = "../../crates/shipflow-core" }
shipflow-service-runtime = { path = "../../crates/shipflow-service-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3.5"
