name: Build ShipFlow Updater Artifacts

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  docker-bundle:
    uses: ./.github/workflows/build-docker-bundle.yml
    with:
      signed: true
    secrets:
      SHIPFLOW_BUNDLE_SIGNING_KEY: ${{ secrets.SHIPFLOW_BUNDLE_SIGNING_KEY }}
      SHIPFLOW_BUNDLE_PUBLIC_KEY: ${{ secrets.SHIPFLOW_BUNDLE_PUBLIC_KEY }}

  updater:
    needs: docker-bundle
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            package_script: package:macos
          - os: windows-latest
            platform: windows
            package_script: package:windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
      SHIPFLOW_REQUIRE_BUNDLE_SIGNATURE: true
      SHIPFLOW_BUNDLE_PUBLIC_KEY: ${{ secrets.SHIPFLOW_BUNDLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Prepare Windows DuckDB SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/prepare-duckdb-download.ps1
      - name: Download matching Docker bundle
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v6
        with:
          name: shipflow-docker-bundle
          path: build/docker
      - name: Install dependencies
        run: npm ci
      - name: Check security baseline
        run: npm run security:baseline
      - name: Verify Quality Gate for commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_GATE_EVENT: push
        run: node scripts/verify-quality-gate.mjs
      - name: Validate macOS credentials
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done
      - name: Validate Windows credentials
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw 'Windows signing credentials are required.'
          }
      - name: Build signed Electron updater artifacts
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: npm run ${{ matrix.package_script }}
      - name: Verify package contents
        env:
          SHIPFLOW_REQUIRE_WINDOWS_SIGNATURE: ${{ runner.os == 'Windows' }}
        run: npm run package:verify
      - name: Upload updater artifacts
        uses: actions/upload-artifact@v6
        with:
          name: shipflow-${{ matrix.platform }}-updater
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
