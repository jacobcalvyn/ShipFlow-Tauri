name: Build Desktop macOS

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: "Build signed and notarized release artifacts. Requires Apple Developer ID and updater secrets."
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    if: ${{ !inputs.signed_release || github.ref == 'refs/heads/main' }}
    env:
      SIGNED_RELEASE: ${{ inputs.signed_release && 'true' || 'false' }}

    steps:
      - name: Validate signed release ref
        if: ${{ inputs.signed_release }}
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Signed release workflows must run from the main branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check security baseline
        run: npm run security:baseline

      - name: Run frontend tests
        run: npm test

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build macOS frontend bundle
        run: npm run build

      - name: Validate macOS signing secrets
        if: ${{ inputs.signed_release }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for a signed macOS desktop release."
              missing=1
            fi
          done

          for name in TAURI_UPDATER_PUBLIC_KEY TAURI_UPDATER_ENDPOINTS; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for an updater-ready macOS desktop release."
              missing=1
            fi
          done

          if { [ -z "$APPLE_API_PRIVATE_KEY" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ]; } && { [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            echo "::error::App Store Connect API key or Apple ID notarization credentials are required."
            missing=1
          fi

          exit "$missing"

      - name: Import Apple signing certificate
        if: ${{ inputs.signed_release }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/shipflow-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect key
        if: ${{ inputs.signed_release }}
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "App Store Connect API key not configured; Apple ID notarization path may be used."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Build unsigned macOS application bundle and DMG installer
        if: ${{ !inputs.signed_release }}
        shell: bash
        run: npm exec tauri -- build --bundles app,dmg --ci

      - name: Build signed macOS application bundle and DMG installer
        if: ${{ inputs.signed_release }}
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          RELEASE_CONFIG_PATH="$RUNNER_TEMP/shipflow-desktop-release.conf.json"
          node scripts/create-release-build-config.mjs desktop "$RELEASE_CONFIG_PATH"
          npm exec tauri -- build --bundles app,dmg --ci --config "$RELEASE_CONFIG_PATH"

      - name: Sign macOS desktop readiness bundle
        if: ${{ !inputs.signed_release }}
        run: bash scripts/macos/sign-dev-app-bundle.sh "target/release/bundle/macos/ShipFlow Desktop.app"

      - name: Smoke check macOS desktop artifacts
        shell: bash
        run: |
          APP_PATH="$(find target/release/bundle/macos -maxdepth 1 -name 'ShipFlow Desktop.app' -print -quit)"
          DMG_PATH="$(find target/release/bundle -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          test -n "$(find "$APP_PATH/Contents/Resources" -maxdepth 1 -name '*.icns' -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = "com.shipflow.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")" = "shipflow3-tauri"

      - name: Verify macOS app bundle signature
        if: ${{ inputs.signed_release }}
        run: |
          APP_PATH="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize macOS desktop app bundle
        if: ${{ inputs.signed_release }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          APP_PATH="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          bash scripts/macos/notarize-app.sh "$APP_PATH" "ShipFlow Desktop"

      - name: Notarize macOS desktop DMG installer
        if: ${{ inputs.signed_release }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          DMG_PATH="$(find target/release/bundle -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          bash scripts/macos/notarize-app.sh "$DMG_PATH" "ShipFlow Desktop DMG"

      - name: Archive macOS app bundle
        shell: bash
        run: |
          APP_PATH="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" target/release/bundle/macos/ShipFlow-Desktop-macos-app.zip

      - name: Generate macOS desktop release evidence
        if: ${{ inputs.signed_release }}
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
        run: node scripts/generate-release-evidence.mjs desktop macos distribution target/release/bundle/shipflow-desktop-macos-distribution.evidence.json

      - name: Verify macOS desktop release evidence
        if: ${{ inputs.signed_release }}
        run: node scripts/verify-release-evidence.mjs desktop macos distribution target/release/bundle/shipflow-desktop-macos-distribution.evidence.json

      - name: Upload macOS distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: shipflow-desktop-macos-distribution
          path: |
            target/release/bundle/shipflow-desktop-macos-distribution.evidence.json
            target/release/bundle/macos/ShipFlow-Desktop-macos-app.zip
            target/release/bundle/**/*.dmg
          if-no-files-found: error
