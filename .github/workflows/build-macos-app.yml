name: Build ShipFlow macOS

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a Developer ID signed and notarized release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ !inputs.signed_release || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Check security baseline
        run: npm run security:baseline
      - name: Run quality checks
        run: |
          npm test
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
      - name: Validate signing credentials
        if: ${{ inputs.signed_release }}
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done
      - name: Build Electron macOS suite
        env:
          CSC_LINK: ${{ inputs.signed_release && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.signed_release && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.signed_release && 'true' || 'false' }}
        run: npm run package:macos
      - name: Verify package contents
        run: |
          npm run package:verify
          APP_PATH="$(find release -maxdepth 3 -name 'ShipFlow Desktop.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/Contents/Resources/native/shipflow-service"
          test -x "$APP_PATH/Contents/Resources/native/shipflow-workspace-host"
          test "$('/usr/libexec/PlistBuddy' -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = "com.shipflow.desktop"
      - name: Upload macOS suite
        uses: actions/upload-artifact@v6
        with:
          name: shipflow-macos-suite
          path: |
            release/*.dmg
            release/*.zip
            release/*latest*.yml
            release/*.blockmap
          if-no-files-found: error
