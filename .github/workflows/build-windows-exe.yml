name: Build ShipFlow Windows

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed Windows release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    if: ${{ !inputs.signed_release || github.ref == 'refs/heads/main' }}
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Prepare Windows DuckDB SDK
        shell: pwsh
        run: ./scripts/windows/prepare-duckdb-download.ps1
      - name: Install dependencies
        run: npm ci
      - name: Check security baseline
        run: npm run security:baseline
      - name: Verify Quality Gate for commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-quality-gate.mjs
      - name: Validate signing credentials
        if: ${{ inputs.signed_release }}
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are required.'
          }
      - name: Build unsigned Electron Windows suite
        if: ${{ !inputs.signed_release }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:windows
      - name: Build signed Electron Windows suite
        if: ${{ inputs.signed_release }}
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: npm run package:windows
      - name: Verify package contents
        shell: pwsh
        run: |
          npm run package:verify
          $resourceRoot = Get-ChildItem release -Recurse -Directory | Where-Object { $_.FullName -like '*resources\native' } | Select-Object -First 1
          if ($null -eq $resourceRoot) { throw 'Missing Electron native resource directory' }
          foreach ($file in @('shipflow-service.exe', 'shipflow-workspace-host.exe', 'duckdb.dll')) {
            if (-not (Test-Path (Join-Path $resourceRoot.FullName $file))) { throw "Missing $file" }
          }
          if (-not (Get-ChildItem release -File -Filter '*.exe')) { throw 'Missing NSIS installer' }
          if (-not (Test-Path 'target/release/duckdb.dll')) { throw 'Missing source DuckDB runtime DLL' }
      - name: Upload Windows suite
        uses: actions/upload-artifact@v6
        with:
          name: shipflow-windows-suite
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
