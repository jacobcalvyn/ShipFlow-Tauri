name: Build Desktop Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Windows desktop app binary
        run: npm exec tauri -- build --no-bundle --config src-tauri/tauri.bundle.conf.json --ci

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Windows desktop installer
        shell: pwsh
        run: ./scripts/windows/build-desktop-installer.ps1

      - name: Smoke check Windows desktop artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/shipflow3-tauri.exe")) {
            throw "Missing desktop executable"
          }
          if (-not (Test-Path "target/release/ShipFlow-Desktop-Setup.exe")) {
            throw "Missing desktop installer"
          }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Missing desktop installer icon"
          }

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: shipflow-desktop-windows-installer
          path: target/release/ShipFlow-Desktop-Setup.exe
          if-no-files-found: error
