name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Check security baseline
        run: npm run security:baseline
      - name: Check TypeScript and build Electron renderer
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Check Rust format
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace --all-targets
      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Electron runtime dependencies
        run: npx playwright install-deps chromium
      - name: Run Electron smoke tests
        run: xvfb-run --auto-servernum npm run test:e2e

  native-runtime:
    name: Electron Native Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Prepare Windows DuckDB SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/prepare-duckdb-download.ps1
      - name: Install dependencies
        run: npm ci
      - name: Check security baseline
        run: npm run security:baseline
      - name: Test native IPC transport
        run: cargo test -p shipflow-ipc -p shipflow-service-client
      - name: Build unpacked Electron suite
        run: npm run package:dir
      - name: Verify packaged Electron suite
        run: npm run package:verify
      - name: Verify packaged native resources on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -x "release/mac-arm64/ShipFlow Desktop.app/Contents/Resources/native/shipflow-service" || test -x "release/mac/ShipFlow Desktop.app/Contents/Resources/native/shipflow-service"
      - name: Verify packaged native resources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $resourceRoot = Get-ChildItem release -Recurse -Directory | Where-Object { $_.FullName -like '*resources\native' } | Select-Object -First 1
          if ($null -eq $resourceRoot) { throw 'Missing Electron native resource directory' }
          foreach ($file in @('shipflow-service.exe', 'shipflow-workspace-host.exe', 'duckdb.dll')) {
            if (-not (Test-Path (Join-Path $resourceRoot.FullName $file))) { throw "Missing $file" }
          }
