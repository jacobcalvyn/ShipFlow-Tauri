name: Build ShipFlow Service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-service:
    name: Build service on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/shipflow-service-runtime -> target
            apps/service -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build service frontend assets
        run: npm run build

      - name: Run service runtime Rust tests
        run: cargo test --manifest-path crates/shipflow-service-runtime/Cargo.toml

      - name: Run service package Rust tests
        run: cargo test --manifest-path apps/service/Cargo.toml

      - name: Build service app binary
        run: cargo build --manifest-path apps/service/Cargo.toml --release --features custom-protocol

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Build Windows service installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sourceExe = (Resolve-Path "apps/service/target/release/shipflow-service.exe").Path
          $outputDir = (Resolve-Path "apps/service/target/release").Path
          $outputExe = Join-Path $outputDir "ShipFlow-Service-Setup.exe"
          $iconFile = (Resolve-Path "src-tauri/icons/service-icon.ico").Path
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS/makensis.exe"
          }
          & $makensis "/DAPP_VERSION=0.1.0" "/DSOURCE_EXE=$sourceExe" "/DOUT_FILE=$outputExe" "/DICON_FILE=$iconFile" "scripts/windows/shipflow-service-installer.nsi"

      - name: Upload macOS service binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: shipflow-service-macos
          path: apps/service/target/release/shipflow-service
          if-no-files-found: error

      - name: Upload Windows service installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: shipflow-service-windows-installer
          path: apps/service/target/release/ShipFlow-Service-Setup.exe
          if-no-files-found: error
