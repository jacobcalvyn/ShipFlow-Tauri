[package]
name = "shipflow-workspace-engine"
version = "0.1.0"
edition = "2021"
description = "Rust-owned workspace data engine for ShipFlow Desktop"
license = "UNLICENSED"

[dependencies]
hex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shipflow-core = { path = "../shipflow-core" }
time = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
duckdb = { workspace = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
duckdb = { workspace = true, features = ["bundled"] }

[dev-dependencies]
serde_json = { workspace = true }
