[package]
name = "shipflow3-tauri"
version = "0.1.0"
description = "Desktop shipment tracking app built with Tauri"
authors = ["Codex"]
edition = "2021"
default-run = "shipflow3-tauri"

[lib]
name = "shipflow3_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde = { workspace = true }
shipflow-workspace-engine = { path = "../crates/shipflow-workspace-engine" }
shipflow-tauri-runtime = { path = "../crates/shipflow-tauri-runtime" }
tauri = { workspace = true }
tokio = { workspace = true }
